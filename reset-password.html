<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Vow &amp; Co.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="wrap wizard-header">
  <a href="index.html" class="brand">VOW &amp; CO.</a>
  <a href="login.html" class="loginlink" style="color:var(--muted); font-size:0.85rem;">Back to log in</a>
</header>

<div class="wrap wizard-body" style="max-width:460px;">
  <div class="results-summary" style="margin-bottom:36px;">
    <div class="eyebrow">RESET YOUR PASSWORD</div>
    <h2>Forgot your password?</h2>
    <p class="line">Enter your email and we'll send you a link to choose a new one.</p>
  </div>

  <div id="setupNotice" class="wizard-error" style="display:none; margin-bottom:20px;"></div>

  <div id="sentNotice" style="display:none; background:var(--offwhite); border:1px solid var(--line); padding:18px 20px; font-size:0.9rem; margin-bottom:24px;">
    If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).
  </div>

  <form id="resetForm" novalidate>
    <div class="wizard-field">
      <input type="email" id="fieldEmail" placeholder="Email address" required autocomplete="email">
    </div>
    <div class="wizard-error" id="formError"></div>
    <div class="wizard-nav" style="margin-top:24px;">
      <button type="submit" class="btn btn--black" id="submitBtn" style="width:100%; justify-content:center;">Send reset link</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  const form = document.getElementById('resetForm');
  const errEl = document.getElementById('formError');
  const setupNotice = document.getElementById('setupNotice');
  const sentNotice = document.getElementById('sentNotice');
  const btn = document.getElementById('submitBtn');

  window.VOWSUPA.ready.then(function () {
    if (!window.VOWSUPA.configured) {
      setupNotice.textContent = "This site isn't connected to Supabase yet — copy .env.example to .env and fill in your project URL and publishable key, then reload.";
      setupNotice.style.display = 'block';
    }
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errEl.style.display = 'none';
    const email = document.getElementById('fieldEmail').value.trim();
    if (!email) {
      errEl.textContent = 'Enter your email address.';
      errEl.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Sending…';
    const result = await VOWAUTH.resetPasswordForEmail(email);
    btn.disabled = false;
    btn.textContent = 'Send reset link';
    if (result.error) {
      errEl.textContent = result.error.message || 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      return;
    }
    form.style.display = 'none';
    sentNotice.style.display = 'block';
  });
})();
</script>
</body>
</html>
