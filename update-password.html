<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a new password — Vow &amp; Co.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="wrap wizard-header">
  <a href="index.html" class="brand"><span class="brand-mark" aria-hidden="true">V</span>Vowly</a>
  <a href="login.html" class="loginlink" style="color:var(--muted); font-size:0.85rem;">Back to log in</a>
</header>

<div class="wrap wizard-body" style="max-width:460px;">
  <div class="results-summary" style="margin-bottom:36px;">
    <div class="eyebrow">CHOOSE A NEW PASSWORD</div>
    <h2>Set a new password</h2>
    <p class="line" id="pageSub">This page only works when opened from the reset link we emailed you.</p>
  </div>

  <div id="setupNotice" class="wizard-error" style="display:none; margin-bottom:20px;"></div>
  <div id="doneNotice" style="display:none; background:var(--offwhite); border:1px solid var(--line); padding:18px 20px; font-size:0.9rem; margin-bottom:24px;">
    Your password has been updated. <a href="dashboard.html" style="text-decoration:underline; color:var(--black);">Go to your dashboard</a>.
  </div>

  <form id="updateForm" novalidate>
    <div class="wizard-field">
      <input type="password" id="fieldPassword" placeholder="New password (min. 6 characters)" required minlength="6" autocomplete="new-password">
    </div>
    <div class="wizard-error" id="formError"></div>
    <div class="wizard-nav" style="margin-top:24px;">
      <button type="submit" class="btn btn--black" id="submitBtn" style="width:100%; justify-content:center;">Update password</button>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  const form = document.getElementById('updateForm');
  const errEl = document.getElementById('formError');
  const setupNotice = document.getElementById('setupNotice');
  const doneNotice = document.getElementById('doneNotice');
  const btn = document.getElementById('submitBtn');

  window.VOWSUPA.ready.then(function () {
    if (!window.VOWSUPA.configured) {
      setupNotice.textContent = "This site isn't connected to Supabase yet — copy .env.example to .env and fill in your project URL and publishable key, then reload.";
      setupNotice.style.display = 'block';
      return;
    }
    // Supabase reads the recovery token out of the URL itself
    // (detectSessionInUrl: true in js/supabase.js) and turns it into a
    // temporary session — if there isn't one, this link is invalid/expired.
    VOWAUTH.getSession().then(function (result) {
      if (!result.data) {
        document.getElementById('pageSub').textContent = "This link looks invalid or has expired — request a new one from the reset password page.";
        form.style.display = 'none';
      }
    });
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    errEl.style.display = 'none';
    const password = document.getElementById('fieldPassword').value;
    if (!password || password.length < 6) {
      errEl.textContent = 'Your password needs to be at least 6 characters.';
      errEl.style.display = 'block';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Updating…';
    const result = await VOWAUTH.updatePassword(password);
    btn.disabled = false;
    btn.textContent = 'Update password';
    if (result.error) {
      errEl.textContent = result.error.message || 'Something went wrong. Please try again.';
      errEl.style.display = 'block';
      return;
    }
    form.style.display = 'none';
    doneNotice.style.display = 'block';
  });
})();
</script>
</body>
</html>
